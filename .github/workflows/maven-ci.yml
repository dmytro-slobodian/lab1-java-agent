name: Maven CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify with Maven on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Verify with Maven on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./build.sh